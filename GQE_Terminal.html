<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GQE · Disclosure–Performance Divergence Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --bg:#020712; --bg-2:#050C17; --card:#07121F; --card-2:#0A1727;
  --bd:#12344A; --bd-2:#153B52; --bd-3:#16364C; --bd-hi:#24718D;
  --cyan:#13D9FF; --blue:#268CFF; --teal:#14D7A2; --purple:#9B76FF;
  --pink:#DF62FF; --amber:#FFB13E; --orange:#FF9F43; --red:#FF5F6B;
  --tx:#F1F6F8; --tx-2:#9AAEB9; --tx-3:#6F8794; --tx-4:#506A78;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
  --sh:0 15px 50px rgba(0,0,0,.35);
  --sig-high:var(--red); --sig-mod:var(--amber); --sig-low:var(--blue); --sig-align:var(--teal);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); font-size:13px; color:var(--tx);
  background:
    radial-gradient(circle at 18% 12%, rgba(38,140,255,.07), transparent 42%),
    radial-gradient(circle at 82% 8%, rgba(155,118,255,.055), transparent 40%),
    radial-gradient(circle at 60% 92%, rgba(19,217,255,.045), transparent 45%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:#173B50;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}
*{scrollbar-width:thin;scrollbar-color:#173B50 var(--bg-2)}
a{color:var(--cyan);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================= LAYOUT ============================= */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#020610 0%,#040A14 60%,#030913 100%);
  border-right:1px solid var(--bd);z-index:40;
}
.main{min-width:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px}
.brand .mark{width:38px;height:38px;flex:none}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.08em;margin:0;line-height:1}
.brand .sub{font-size:9.5px;color:var(--tx-3);letter-spacing:.10em;text-transform:uppercase;
  margin-top:4px;line-height:1.3}
.navwrap{flex:1;overflow-y:auto;padding:6px 0 10px}
.nav{display:flex;flex-direction:column;gap:1px}
.navi{
  display:flex;align-items:center;gap:10px;padding:8px 14px 8px 13px;
  border-left:2px solid transparent;color:var(--tx-3);text-align:left;
  border-radius:0 var(--r-sm) var(--r-sm) 0;transition:background .16s,color .16s,border-color .16s;
}
.navi svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.navi .lab{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--tx-2);line-height:1.2;transition:color .16s}
.navi .dsc{font-size:9.5px;color:var(--tx-4);margin-top:2px;line-height:1.2}
.navi:hover{background:rgba(38,140,255,.06);color:var(--cyan)}
.navi:hover .lab{color:var(--tx)}
.navi[aria-current="page"]{
  background:linear-gradient(90deg,rgba(19,217,255,.16),rgba(38,140,255,.05) 70%,transparent);
  border-left-color:var(--cyan); color:var(--cyan);
  box-shadow:inset 0 0 22px rgba(19,217,255,.10);
}
.navi[aria-current="page"] .lab{color:var(--cyan);text-shadow:0 0 12px rgba(19,217,255,.5)}
.navi[aria-current="page"] .dsc{color:var(--tx-3)}
.sidefoot{margin-top:auto;padding:12px 14px 16px;border-top:1px solid var(--bd)}
.sidefoot-btns{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sidefoot-btns .pillbtn{flex:1;justify-content:center}
.sidefoot .stamp{text-align:left}
.horizon{display:block;width:100%;height:96px;border-radius:var(--r-sm);
  border:1px solid var(--bd);overflow:hidden;margin-bottom:10px}
.dlbtn{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:9px 12px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,rgba(19,217,255,.14),rgba(38,140,255,.07));
  border:1px solid var(--bd-2);color:var(--cyan);font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;transition:border-color .16s,box-shadow .16s}
.dlbtn:hover{border-color:var(--bd-hi);box-shadow:0 0 22px rgba(19,217,255,.16)}

/* ---------- header ---------- */
.hdr{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;
  padding:4px 0 14px;border-bottom:1px solid var(--bd);}
.hdr h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.hdr .tag{font-size:13px;color:var(--tx-2);margin-top:7px;max-width:64ch;line-height:1.45}
.hdr-r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.hdr-ctl{display:flex;align-items:center;gap:8px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);
  border:1px solid var(--bd);background:var(--card);color:var(--tx-2);transition:.16s}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.iconbtn:hover{border-color:var(--bd-hi);color:var(--cyan);box-shadow:0 0 18px rgba(19,217,255,.12)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;
  font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.14)}
.pillbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--bd-2);background:linear-gradient(135deg,rgba(19,217,255,.13),rgba(38,140,255,.06));
  color:var(--cyan);transition:.16s;white-space:nowrap}
.pillbtn:hover{border-color:var(--bd-hi);box-shadow:0 0 20px rgba(19,217,255,.18)}
.pillbtn.on{background:linear-gradient(135deg,rgba(155,118,255,.20),rgba(223,98,255,.08));
  border-color:#4B3A7A;color:#C9B4FF}
.stamp{text-align:right;font-size:9.5px;color:var(--tx-4);letter-spacing:.06em;line-height:1.5}
.stamp b{color:var(--tx-2);font-family:var(--mono);font-weight:500}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 9px var(--teal);display:inline-block}

/* ---------- filter bar ---------- */
.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:11px 13px;border-radius:var(--r);background:linear-gradient(180deg,var(--card),#06101B);
  border:1px solid var(--bd)}
.fgrp{display:flex;align-items:center;gap:7px}
.flab{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-4);font-weight:700}
select,.searchbox{background:var(--card-2);border:1px solid var(--bd);color:var(--tx);
  border-radius:var(--r-sm);padding:6px 9px;font:inherit;font-size:11.5px;transition:.16s}
select:hover,.searchbox:hover{border-color:var(--bd-hi)}
.searchbox{width:190px;font-family:var(--mono);font-size:11px}
.searchbox::placeholder{color:var(--tx-4)}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card-2);
  font-size:10.5px;font-weight:600;color:var(--tx-3);transition:.16s;white-space:nowrap}
.chip:hover{border-color:var(--bd-hi);color:var(--tx)}
.chip[aria-pressed="true"]{color:#02121A;font-weight:700}
.chip.s-high[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.chip.s-mod[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.chip.s-low[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.s-align[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.chip.s-all[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan)}
.fspacer{flex:1 1 auto}
.fcount{font-family:var(--mono);font-size:11px;color:var(--tx-3);white-space:nowrap}
.fcount b{color:var(--cyan)}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,var(--card) 0%,#06101C 100%);
  border:1px solid var(--bd-3);border-radius:var(--r);padding:14px;box-shadow:var(--sh);
  transition:border-color .18s,box-shadow .18s;min-width:0}
.card:hover{border-color:var(--bd-hi);box-shadow:0 0 25px rgba(19,217,255,.08),var(--sh)}
.card.glow-red{border-color:rgba(255,95,107,.42);box-shadow:0 0 28px rgba(255,95,107,.10),var(--sh)}
.card.glow-cyan{border-color:rgba(19,217,255,.34);box-shadow:0 0 28px rgba(19,217,255,.10),var(--sh)}
.card.glow-purple{border-color:rgba(155,118,255,.34);box-shadow:0 0 28px rgba(155,118,255,.10),var(--sh)}
.ctitle{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tx-3);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ctitle svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;color:var(--cyan)}
.ctitle .spacer{flex:1}
.chint{font-size:9.5px;color:var(--tx-4);font-weight:500;letter-spacing:.02em;text-transform:none}
.cfoot{font-size:10.5px;color:var(--tx-4);line-height:1.5;margin-top:10px;
  border-top:1px solid rgba(255,255,255,.045);padding-top:9px}
.cfoot b{color:var(--tx-2)}

/* ---------- grid ---------- */
.grid{display:grid;gap:13px}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr)}
.lower{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr)}

/* ---------- KPI ---------- */
.kpi{position:relative;overflow:hidden}
.kpi .kt{display:flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--tx-4);font-weight:700}
.kpi .kt svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.kpi .kv{font-family:var(--mono);font-size:29px;font-weight:600;line-height:1.05;
  margin-top:9px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .ku{font-size:12px;color:var(--tx-3);font-family:var(--mono)}
.kpi .kd{font-size:9.5px;color:var(--tx-3);margin-top:5px;letter-spacing:.03em}
.kpi .spark{margin-top:9px;display:block;width:100%;height:26px}
.kpi.ring .kv{font-size:24px}
.kpi-row{display:flex;align-items:flex-start;gap:10px}
.kpi-row .col{flex:1;min-width:0}

/* ---------- tables ---------- */
.tw{overflow:auto;max-height:none;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead th{position:sticky;top:0;background:#081420;z-index:2;
  font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-4);
  font-weight:700;text-align:left;padding:8px 9px;border-bottom:1px solid var(--bd);
  white-space:nowrap;user-select:none}
thead th.srt{cursor:pointer}
thead th.srt:hover{color:var(--cyan)}
thead th .ind{color:var(--cyan);margin-left:3px}
tbody td{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.035);color:var(--tx-2);
  white-space:nowrap}
tbody tr:hover td{background:rgba(19,217,255,.045);color:var(--tx)}
tbody tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.co{color:var(--tx);font-weight:600}

/* ---------- signal pill ---------- */
.sig{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:9.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;
  border:1px solid currentColor;background:rgba(255,255,255,.035)}
.sig .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.s-high{color:var(--red)} .s-mod{color:var(--amber)}
.s-low{color:var(--blue)} .s-align{color:var(--teal)}

/* ---------- misc ---------- */
.rowline{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(255,255,255,.035)}
.rowline:hover{background:rgba(19,217,255,.05)}
.rowline .rk{font-family:var(--mono);font-size:11px;color:var(--tx-4);width:16px;flex:none}
.rowline .nm{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowline .sc{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.linkrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}
.linkrow:hover{text-decoration:underline}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.dqrow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11px;color:var(--tx-2)}
.dqrow .ok{color:var(--teal);font-weight:700;width:12px}
.dqrow .lb{flex:1}
.dqrow .vl{font-family:var(--mono);font-size:11px;color:var(--tx)}
.dqrow .na{color:var(--tx-4);font-style:italic;font-size:10.5px}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:10.5px;line-height:1.55;
  background:rgba(155,118,255,.07);border:1px solid rgba(155,118,255,.28);color:var(--tx-2)}
.note b{color:#C9B4FF}
.note.cy{background:rgba(19,217,255,.06);border-color:rgba(19,217,255,.26)}
.note.cy b{color:var(--cyan)}
.note.rd{background:rgba(255,95,107,.06);border-color:rgba(255,95,107,.28)}
.note.rd b{color:var(--red)}
.note.am{background:rgba(255,177,62,.06);border-color:rgba(255,177,62,.28)}
.note.am b{color:var(--amber)}
.eq{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:4px 0}
.eq .box{text-align:center;padding:9px 15px;border-radius:var(--r-sm);
  background:var(--card-2);border:1px solid var(--bd);min-width:96px}
.eq .box .t{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:700}
.eq .box .v{font-family:var(--mono);font-size:14px;color:var(--tx);margin-top:3px;font-weight:600}
.eq .op{font-family:var(--mono);font-size:19px;color:var(--cyan)}
.empty{padding:26px 14px;text-align:center;color:var(--tx-4);font-size:11.5px}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:9.5px;color:var(--tx-3);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,7,18,.62);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);z-index:61;
  background:linear-gradient(180deg,#061019,#040B14);border-left:1px solid var(--bd-2);
  box-shadow:-24px 0 70px rgba(0,0,0,.6);transform:translateX(100%);
  transition:transform .26s cubic-bezier(.22,.7,.3,1);overflow-y:auto;padding:18px}
.drawer.open{transform:translateX(0)}
.drawer h3{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.drawer .dsub{font-size:10.5px;color:var(--tx-3);margin-top:4px;letter-spacing:.05em}
.dclose{position:absolute;top:14px;right:14px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}
.dcell{background:var(--card-2);border:1px solid var(--bd);border-radius:var(--r-sm);padding:9px 11px}
.dcell .t{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-4);font-weight:700}
.dcell .v{font-family:var(--mono);font-size:16px;margin-top:3px;font-weight:600}
.dcell .s{font-size:9.5px;color:var(--tx-4);margin-top:2px}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:80;pointer-events:none;opacity:0;transition:opacity .12s;
  background:#08151F;border:1px solid var(--bd-2);border-radius:var(--r-sm);
  padding:8px 10px;font-size:10.5px;color:var(--tx-2);box-shadow:0 12px 34px rgba(0,0,0,.55);
  max-width:250px;line-height:1.5}
.tip.on{opacity:1}
.tip b{color:var(--tx);font-size:11.5px}
.tip .mono{font-family:var(--mono)}

/* ---------- animation ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.page>*{animation:fadeUp .34s ease both}
.page>*:nth-child(2){animation-delay:.04s}
.page>*:nth-child(3){animation-delay:.08s}
.page>*:nth-child(4){animation-delay:.12s}
.page>*:nth-child(5){animation-delay:.16s}
.node{transition:r .16s,opacity .16s}
.node:hover{filter:url(#nglow)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- responsive ---------- */
@media (max-width:1500px){ .lower{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
@media (max-width:1280px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .brand h1,.brand .sub,.navi .lab,.navi .dsc,.sidefoot{display:none}
  .navi{justify-content:center;padding:11px 0}
  .k6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1024px){
  .main{padding:14px}
  .k6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.lower{grid-template-columns:minmax(0,1fr)}
  .hdr h2{font-size:19px}
}
@media print{
  .side,.filters,.hdr-r,.drawer,.scrim{display:none!important}
  body{background:#fff;color:#000}
  .app{grid-template-columns:1fr}
  .card{border:1px solid #ccc;box-shadow:none;background:#fff;color:#000;break-inside:avoid}
}
</style>
</head>
<body>
<div class="tip" id="tip" role="tooltip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Company detail"></aside>

<div class="app">
  <nav class="side" aria-label="Primary">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#13D9FF"/><stop offset="1" stop-color="#268CFF"/>
          </linearGradient>
          <radialGradient id="rg"><stop offset="0" stop-color="#13D9FF" stop-opacity=".55"/>
            <stop offset="1" stop-color="#13D9FF" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="20" cy="20" r="19" fill="url(#rg)"/>
        <circle cx="20" cy="20" r="14.5" fill="none" stroke="url(#lg)" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="9" fill="none" stroke="#268CFF" stroke-width="1" opacity=".65"/>
        <ellipse cx="20" cy="20" rx="18" ry="6.6" fill="none" stroke="#13D9FF" stroke-width=".9"
          opacity=".55" transform="rotate(-28 20 20)"/>
        <path d="M10 24 L16 17 L21 21 L30 11" fill="none" stroke="#13D9FF" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="30" cy="11" r="2.4" fill="#13D9FF"/>
      </svg>
      <div>
        <h1>GQE</h1>
        <div class="sub">Greenwashing<br>Quantification Engine</div>
      </div>

/* ==================================================================
   GQE INTELLIGENCE TERMINAL — core
   Every figure on screen is derived from DATA, which is the same
   verified payload the audited GQE dashboard uses. Nothing is invented:
   where a quantity does not exist in the data the UI prints "Not available".
   ================================================================== */
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const NA = '<span style="color:var(--tx-4);font-style:italic">Not available</span>';

/* ---------------- numeric helpers ---------------- */
const fmt = (v, d = 2) => isNum(v) ? v.toFixed(d) : "—";
const sgn = (v, d = 2) => isNum(v) ? (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) : "—";
const pct = (v, d = 1) => isNum(v) ? (v * 100).toFixed(d) + "%" : "—";
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
const sd = (a, dd = 0) => {
  if (a.length - dd <= 0) return NaN;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - dd));
};
const quant = (a, q) => {
  if (!a.length) return NaN;
  const s = a.slice().sort((x, y) => x - y), h = (s.length - 1) * q;
  const lo = Math.floor(h), hi = Math.ceil(h);
  return lo === hi ? s[lo] : s[lo] + (h - lo) * (s[hi] - s[lo]);
};
function pearson(x, y) {
  const n = x.length; if (n < 3) return NaN;
  const mx = mean(x), my = mean(y);
  let a = 0, b = 0, c = 0;
  for (let i = 0; i < n; i++) { const dx = x[i] - mx, dy = y[i] - my; a += dx * dy; b += dx * dx; c += dy * dy; }
  return (b && c) ? a / Math.sqrt(b * c) : NaN;
}

/* ---------------- derived indices ---------------- */
const META = DATA.meta;
const YEARS = DATA.years.map(y => y.y);
const YLAB = {}; DATA.years.forEach(y => { YLAB[y.y] = y.label; });
const SECTOR_OF = {}, SECTOR_N = {};
DATA.companies.forEach(c => { SECTOR_OF[c.c] = c.s; SECTOR_N[c.s] = c.n; });
const SECTORS = Array.from(new Set(DATA.companies.map(c => c.s))).sort();
const OPS_BY = {}; DATA.ops.forEach(r => { OPS_BY[r.c + "|" + r.y] = r; });
const CAR_BY = {}; DATA.cars.forEach(r => { CAR_BY[r.c + "|" + r.y] = r; });
const FIN_BY = {}; DATA.fin.forEach(r => { FIN_BY[r.c + "|" + r.y] = r; });
const LPS_BY = {}; (DATA.lps || []).forEach(r => { LPS_BY[r.c + "|" + r.y] = r; });
const TOP_BY = {}; (DATA.topics || []).forEach(r => { TOP_BY[r.c + "|" + r.y] = r; });

/* within-year moments of the read-only score column, ddof = 0 to match the
   convention the stored z-scores were built under (meta.zddof) */
const YSTAT = {};
YEARS.forEach(y => {
  const v = DATA.gds.filter(r => r.y === y).map(r => r.G);
  YSTAT[y] = { n: v.length, mean: mean(v), sd: sd(v, 0), q025: quant(v, .025), q975: quant(v, .975) };
});
const bandSD = y => (y && YSTAT[y]) ? YSTAT[y].sd : mean(YEARS.map(k => YSTAT[k].sd));

/* ---------------- signal taxonomy ----------------
   Four classes derived from the same +/-1 SD band the audited dashboard uses.
   Moderate / Low split the middle band by sign; nothing new is assumed. */
const SIGNALS = [
  { k: "high",  lab: "High divergence",  cls: "s-high",  col: "var(--red)",
    d: "Language runs well ahead of measured indicators (≥ +1 SD)" },
  { k: "mod",   lab: "Moderate",         cls: "s-mod",   col: "var(--amber)",
    d: "Language modestly ahead (0 to +1 SD)" },
  { k: "low",   lab: "Low divergence",   cls: "s-low",   col: "var(--blue)",
    d: "Measured indicators modestly ahead (−1 SD to 0)" },
  { k: "align", lab: "Strong alignment", cls: "s-align", col: "var(--teal)",
    d: "Measured indicators run well ahead of language (≤ −1 SD)" }
];
const SIGMAP = {}; SIGNALS.forEach(s => { SIGMAP[s.k] = s; });
function signalOf(G, y) {
  const s = bandSD(y);
  if (!isNum(G)) return null;
  if (G >= s) return "high";
  if (G >= 0) return "mod";
  if (G > -s) return "low";
  return "align";
}
const sigPill = k => {
  const s = SIGMAP[k];
  return s ? '<span class="sig ' + s.cls + '"><i class="dot"></i>' + s.lab + "</span>" : "—";
};
const sigCol = k => (SIGMAP[k] || {}).col || "var(--tx-4)";

/* ---------------- rows enriched once ---------------- */
const ROWS = DATA.gds.map(r => {
  const car = CAR_BY[r.c + "|" + r.y], fin = FIN_BY[r.c + "|" + r.y];
  return {
    c: r.c, y: r.y, s: r.s, G: r.G, Gadj: r.Gadj, zL: r.zL, zO: r.zO,
    LPS: r.LPS, OPS: r.OPS, sig: signalOf(r.G, r.y),
    car1: car ? car.w1 : null, car2: car ? car.w2 : null,
    car3: car ? car.w3 : null, car4: car ? car.w4 : null,
    evd: car ? car.d : null,
    mcap: fin ? fin.logmcap : null, lev: fin ? fin.lev : null
  };
});

/* ---------------- state ---------------- */
const State = {
  view: "overview", year: "ALL", sector: "ALL", signal: "ALL", q: "",
  whatif: false, sortKey: "G", sortDir: -1
};
function rows() {
  const q = State.q.trim().toLowerCase();
  return ROWS.filter(r =>
    (State.year === "ALL" || r.y === State.year) &&
    (State.sector === "ALL" || r.s === State.sector) &&
    (State.signal === "ALL" || r.sig === State.signal) &&
    (!q || r.c.toLowerCase().indexOf(q) >= 0 || r.s.toLowerCase().indexOf(q) >= 0));
}
/* firm level = mean of that firm's rows in view, matching the audited dashboard */
function firmRows(rs) {
  const by = {};
  (rs || rows()).forEach(r => { (by[r.c] = by[r.c] || []).push(r); });
  return Object.keys(by).map(c => {
    const a = by[c];
    return {
      c: c, s: SECTOR_OF[c], n: a.length, rs: a,
      G: mean(a.map(r => r.G)), Gadj: mean(a.map(r => r.Gadj)),
      zL: mean(a.map(r => r.zL)), zO: mean(a.map(r => r.zO)),
      sig: signalOf(mean(a.map(r => r.G)), State.year === "ALL" ? null : State.year),
      car1: (() => { const v = a.map(r => r.car1).filter(isNum); return v.length ? mean(v) : null; })()
    };
  }).sort((x, y) => y.G - x.G);
}

/* ---------------- SVG primitives ---------------- */
const svgOpen = (w, h, cls) =>
  '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" ' +
  'class="' + (cls || "") + '" style="display:block;width:100%;height:auto" role="img">';
const line = (x1, y1, x2, y2, c, w, o) =>
  '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) +
  '" y2="' + y2.toFixed(1) + '" stroke="' + (c || "var(--bd)") + '" stroke-width="' + (w || 1) +
  '"' + (o != null ? ' opacity="' + o + '"' : "") + "/>";
const txt = (x, y, s, o) => {
  o = o || {};
  return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + (o.size || 10) + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : "") +

const rect = (x, y, w, h, f, o) => {
  o = o || {};
  return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(0, w).toFixed(1) +
    '" height="' + Math.max(0, h).toFixed(1) + '" fill="' + f + '"' +

/* ---------------- tooltip ---------------- */
const TIP = $("#tip");
function tipShow(e, html) {
  TIP.innerHTML = html; TIP.classList.add("on");
  const r = TIP.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  TIP.style.left = Math.max(6, x) + "px"; TIP.style.top = Math.max(6, y) + "px";
}
const tipHide = () => TIP.classList.remove("on");
document.addEventListener("scroll", tipHide, true);

/* ---------------- count-up ---------------- */
function countUp(el, to, dp, prefixSign) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.textContent = prefixSign ? sgn(to, dp) : fmt(to, dp); return;
  }
  const t0 = performance.now(), dur = 620;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = to * e;
    el.textContent = prefixSign ? sgn(v, dp) : fmt(v, dp);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---------------- reusable chart pieces ---------------- */
function sparkline(vals, col, w, h) {
  w = w || 150; h = h || 26;
  const v = vals.filter(isNum);
  if (v.length < 2) return "";
  const lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), rg = (hi - lo) || 1;
  const X = i => (i / (v.length - 1)) * w, Y = d => h - 2 - ((d - lo) / rg) * (h - 4);
  let d = "", a = "";
  v.forEach((d0, i) => { d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(d0).toFixed(1) + " "; });
  a = d + "L" + w + " " + h + " L0 " + h + " Z";
  const id = "sg" + Math.random().toString(36).slice(2, 8);
  return svgOpen(w, h) +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + col + '" stop-opacity=".34"/>' +
    '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + a + '" fill="url(#' + id + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.4" ' +
    'stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
/* histogram of values, coloured by the signal each bin falls in */
function histogram(vals, w, h, yForBand) {
  w = w || 300; h = h || 60;
  const v = vals.filter(isNum);
  if (v.length < 4) return '<div class="empty">Too few observations to plot.</div>';
  const lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
  const NB = 26, bw = (hi - lo) / NB || 1;
  const bins = new Array(NB).fill(0);
  v.forEach(x => { const i = Math.min(NB - 1, Math.floor((x - lo) / bw)); bins[i]++; });
  const mx = Math.max.apply(null, bins) || 1;
  const sdv = bandSD(yForBand);
  let out = svgOpen(w, h);
  bins.forEach((n, i) => {
    const c = lo + bw * (i + .5);
    const k = c >= sdv ? "high" : c >= 0 ? "mod" : c > -sdv ? "low" : "align";
    const bh = (n / mx) * (h - 12), x = (i / NB) * w;
    out += rect(x + .7, h - 10 - bh, (w / NB) - 1.4, bh, sigCol(k), { rx: 1.5, op: .82 });
  });
  out += line(0, h - 10, w, h - 10, "var(--bd)", 1);
  const zx = ((0 - lo) / (hi - lo)) * w;
  if (zx > 0 && zx < w) out += line(zx, 2, zx, h - 10, "var(--tx-4)", 1, .5);
  out += txt(0, h - 1, sgn(lo, 1), { size: 8, fill: "var(--tx-4)", mono: 1 });
  out += txt(w, h - 1, sgn(hi, 1), { size: 8, anchor: "end", fill: "var(--tx-4)", mono: 1 });
  if (zx > 12 && zx < w - 12) out += txt(zx, h - 1, "0", { size: 8, anchor: "middle", fill: "var(--tx-4)", mono: 1 });
  return out + "</svg>";
}
/* semicircular gauge */
function gauge(value, lo, hi, w, h) {
  w = w || 300; h = h || 168;
  const cx = w / 2, cy = h - 26, R = Math.min(w / 2 - 16, h - 46);
  const ang = t => Math.PI * (1 - t);
  const pt = (t, r) => [cx + r * Math.cos(ang(t)), cy - r * Math.sin(ang(t))];
  const arc = (t0, t1, r, col, sw, op) => {
    const a = pt(t0, r), b = pt(t1, r);
    return '<path d="M' + a[0].toFixed(1) + " " + a[1].toFixed(1) + " A" + r + " " + r +
      " 0 0 1 " + b[0].toFixed(1) + " " + b[1].toFixed(1) + '" fill="none" stroke="' + col +
      '" stroke-width="' + sw + '" stroke-linecap="round"' + (op ? ' opacity="' + op + '"' : "") + "/>";
  };
  const id = "gg" + Math.random().toString(36).slice(2, 7);
  let out = svgOpen(w, h) +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0">' +
    '<stop offset="0" stop-color="var(--teal)"/><stop offset=".33" stop-color="var(--blue)"/>' +
    '<stop offset=".62" stop-color="var(--amber)"/><stop offset="1" stop-color="var(--red)"/>' +
    "</linearGradient></defs>";
  out += arc(0, 1, R, "rgba(255,255,255,.05)", 13);
  out += arc(0, 1, R, "url(#" + id + ")", 13, .92);
  /* ticks */
  for (let i = 0; i <= 6; i++) {
    const t = i / 6, a = pt(t, R - 11), b = pt(t, R - 16);
    out += line(a[0], a[1], b[0], b[1], "var(--tx-4)", 1, .6);
    const l = pt(t, R - 26);
    out += txt(l[0], l[1] + 3, sgn(lo + (hi - lo) * t, 0), { size: 8, anchor: "middle", fill: "var(--tx-4)", mono: 1 });
  }
  const tv = Math.max(0, Math.min(1, (value - lo) / (hi - lo)));
  const nd = pt(tv, R);
  out += line(cx, cy, nd[0], nd[1], "var(--tx)", 2.1);
  out += '<circle cx="' + nd[0].toFixed(1) + '" cy="' + nd[1].toFixed(1) +
    '" r="5" fill="var(--cyan)" opacity=".92"/>';
  out += '<circle cx="' + cx + '" cy="' + cy + '" r="4.5" fill="#08151F" stroke="var(--bd-hi)" stroke-width="1.2"/>';
  return out + "</svg>";
}
/* donut ring progress */
function ring(frac, col, size, label) {
  size = size || 54;
  const r = size / 2 - 5, cx = size / 2, C = 2 * Math.PI * r;
  return svgOpen(size, size).replace('style="display:block;width:100%;height:auto"',
      'style="display:block;width:' + size + "px;height:" + size + 'px;flex:none"') +
    '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>' +
    '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + col +
    '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (C * Math.max(0, Math.min(1, frac))).toFixed(1) +
    " " + C.toFixed(1) + '" transform="rotate(-90 ' + cx + " " + cx + ')"/>' +
    txt(cx, cx + 3.5, label, { size: 11, anchor: "middle", fill: "var(--tx)", mono: 1, weight: 600 }) +
    "</svg>";
}

/* ---------------- THE UNIVERSE MAP ---------------- */
function universeMap(rs, w, h) {
  w = w || 900; h = h || 520;
  const pts = rs.filter(r => isNum(r.zO) && isNum(r.zL));
  if (pts.length < 3) return '<div class="empty">Not enough observations at this filter to plot the universe.</div>';
  const padL = 58, padR = 26, padT = 26, padB = 46;
  const pw = w - padL - padR, ph = h - padT - padB;
  const xs = pts.map(p => p.zO), ys = pts.map(p => p.zL);
  const xlo = Math.min.apply(null, xs), xhi = Math.max.apply(null, xs);
  const ylo = Math.min.apply(null, ys), yhi = Math.max.apply(null, ys);
  const padx = (xhi - xlo) * .08 || 1, pady = (yhi - ylo) * .08 || 1;
  const X = v => padL + ((v - xlo + padx) / (xhi - xlo + 2 * padx)) * pw;
  const Y = v => padT + ph - ((v - ylo + pady) / (yhi - ylo + 2 * pady)) * ph;
  const x0 = X(0), y0 = Y(0);
  const gs = pts.map(p => Math.abs(p.G));
  const gmax = Math.max.apply(null, gs) || 1;
  const R = g => 2.6 + 4.4 * Math.sqrt(Math.abs(g) / gmax);

  let o = svgOpen(w, h, "umap") +
    "<defs>" +
      '<radialGradient id="core"><stop offset="0" stop-color="#268CFF" stop-opacity=".16"/>' +
        '<stop offset="1" stop-color="#268CFF" stop-opacity="0"/></radialGradient>' +
      '<filter id="nglow" x="-70%" y="-70%" width="240%" height="240%">' +
        '<feGaussianBlur stdDeviation="3.2" result="b"/><feMerge>' +
        '<feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">' +
        '<feGaussianBlur stdDeviation="1.6"/></filter>' +
    "</defs>";
  /* deep field */
  o += rect(padL, padT, pw, ph, "#030A14", { rx: 10 });
  o += '<ellipse cx="' + x0.toFixed(1) + '" cy="' + y0.toFixed(1) + '" rx="' + (pw * .42).toFixed(1) +
    '" ry="' + (ph * .42).toFixed(1) + '" fill="url(#core)"/>';
  /* starfield — deterministic, so the field never dances between renders */
  let seed = 20260824;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  for (let i = 0; i < 90; i++) {
    const sx = padL + rnd() * pw, sy = padT + rnd() * ph, sr = .3 + rnd() * .8;
    o += '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + sr.toFixed(2) +
      '" fill="#CFE8FF" opacity="' + (.05 + rnd() * .16).toFixed(2) + '"/>';
  }
  /* concentric orbital ellipses centred on the cohort origin */
  [.22, .40, .58, .78].forEach(f => {
    o += '<ellipse cx="' + x0.toFixed(1) + '" cy="' + y0.toFixed(1) + '" rx="' + (pw * f * .5).toFixed(1) +
      '" ry="' + (ph * f * .5).toFixed(1) + '" fill="none" stroke="#13D9FF" stroke-width=".6" opacity=".07"/>';
  });
  /* grid */
  for (let i = 1; i < 5; i++) {
    o += line(padL + (pw * i) / 5, padT, padL + (pw * i) / 5, padT + ph, "#0E2436", 1, .55);
    o += line(padL, padT + (ph * i) / 5, padL + pw, padT + (ph * i) / 5, "#0E2436", 1, .55);
  }
  /* axes through the cohort mean */
  o += line(x0, padT, x0, padT + ph, "#1B4A66", 1, .85);
  o += line(padL, y0, padL + pw, y0, "#1B4A66", 1, .85);
  /* quadrant labels */
  const ql = (x, y, a, l1, l2, col) =>
    txt(x, y, l1, { size: 8.5, anchor: a, fill: col, weight: 700, ls: ".09em" }) +
    txt(x, y + 11, l2, { size: 8.5, anchor: a, fill: col, weight: 700, ls: ".09em" });
  o += ql(padL + 10, padT + 16, "start", "HIGH DISCLOSURE", "LOW PERFORMANCE", "rgba(255,95,107,.62)");
  o += ql(padL + pw - 10, padT + 16, "end", "HIGH DISCLOSURE", "HIGH PERFORMANCE", "rgba(19,217,255,.55)");
  o += ql(padL + 10, padT + ph - 20, "start", "LOW DISCLOSURE", "LOW PERFORMANCE", "rgba(154,174,185,.45)");
  o += ql(padL + pw - 10, padT + ph - 20, "end", "LOW DISCLOSURE", "HIGH PERFORMANCE", "rgba(20,215,162,.6)");
  /* nodes, painted low-divergence first so the extremes sit on top */
  pts.slice().sort((a, b) => Math.abs(a.G) - Math.abs(b.G)).forEach(p => {
    const cx = X(p.zO), cy = Y(p.zL), r = R(p.G), col = sigCol(p.sig);
    o += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (r * 2.5).toFixed(1) +
      '" fill="' + col + '" opacity=".10" filter="url(#soft)"/>';
    o += '<circle class="node" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) +
      '" fill="' + col + '" opacity=".92" stroke="' + col + '" stroke-width=".7" ' +
      'data-c="' + esc(p.c) + '" data-y="' + esc(p.y) + '" style="cursor:pointer"/>';
  });
  /* axis labels */
  o += txt(padL + pw / 2, h - 12, "z(OPS)  ·  LOW PERFORMANCE  ←→  HIGH PERFORMANCE",
    { size: 9, anchor: "middle", fill: "var(--tx-4)", ls: ".08em", weight: 600 });
  o += '<g transform="translate(15,' + (padT + ph / 2) + ') rotate(-90)">' +
    txt(0, 0, "z(LPS)  ·  LOW DISCLOSURE  ←→  HIGH DISCLOSURE",
      { size: 9, anchor: "middle", fill: "var(--tx-4)", ls: ".08em", weight: 600 }) + "</g>";
  return o + "</svg>";
}

              '<div style="font-family:var(--mono);font-size:14px;font-weight:600;color:' + sigCol(p[0]) + '">' +
                pct(p[1] / n, 1) + "</div>" +
              '<div style="font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-4);font-weight:700">' +
                (p[0] === "align" ? "Strong alignment" : p[0] === "mod" ? "Moderate / low" : "High divergence") +
              "</div></div>").join("") +
          "</div>" +
          '<div style="margin-top:12px">' + histogram(G, 300, 62, State.year === "ALL" ? null : State.year) + "</div>" +
        "</div>" +
      "</div>" +
    "</div>";

  /* --- LPS vs OPS --- */
  const lpsops = lpsOpsCard(rs);
  /* --- sector heatmap --- */
  const heat = sectorHeatCard(rs);
  /* --- market reaction --- */
  const mkt = marketInsightCard(rs);

  const lower = '<div class="grid lower">' + lpsops + heat + mkt + "</div>";

  /* --- methodology strip + data quality + caveat --- */
  const dq = dataQualityCard(rs);
  const strip =
    '<div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr)">' +
      '<div class="card">' + cardHead("Methodology snapshot", ICON.method, "how the score is built") +
        '<div class="eq">' +
          '<div class="box"><div class="t">GDS (DPD)</div><div class="v">' + sgn(mean(G), 2) + "</div></div>" +
          '<span class="op">=</span>' +
          '<div class="box"><div class="t">Standardised LPS</div><div class="v">z(LPS)</div></div>' +
          '<span class="op">−</span>' +
          '<div class="box"><div class="t">Standardised OPS</div><div class="v">z(OPS)</div></div>' +
          '<span class="op">→</span>' +
          '<div class="box" style="border-color:rgba(255,95,107,.4)"><div class="t">Higher GDS</div>' +
            '<div class="v" style="color:var(--red)">more divergence</div></div>' +
        "</div>" +
        '<div class="note rd" style="margin-top:11px"><b>Not proof of greenwashing or intent to mislead.</b> ' +
          "GDS is a relative divergence signal: it compares a firm against its own fiscal-year cohort " +
          "on two proxies. A high score is a question to investigate, not a verdict.</div>" +
      "</div>" +
      dq +
      '<div class="card glow-purple">' + cardHead("Important caveat", ICON.whatif) +
        '<div class="note"><b>GDS is a relative divergence signal, not proof of greenwashing or intent ' +
        "to mislead.</b><br><br>Both sides are proxies: LPS is one text-derived measure of disclosure " +
        "sentiment with <b>no validated accuracy benchmark</b>, and OPS is one weighted ESG composite " +
        "that mixes environmental, social and governance indicators.<br><br>Two fiscal years support " +
        "<b>no trend and no causal claim</b>. Always interpret with context and domain knowledge.</div>" +
      "</div>" +
    "</div>";

  return k0(k) + hero + lower + strip;
};
const k0 = inner => '<div class="grid k6">' + inner + "</div>";

/* ---------------- shared analytical cards ---------------- */
function lpsOpsCard(rs) {
  const byY = YEARS.map(y => {
    const sub = rs.filter(r => r.y === y);
    return { y: y, l: mean(sub.map(r => r.LPS).filter(isNum)), o: mean(sub.map(r => r.OPS).filter(isNum)), n: sub.length };
  }).filter(d => d.n > 0);
  const lAll = mean(rs.map(r => r.LPS).filter(isNum));
  const oAll = mean(rs.map(r => r.OPS).filter(isNum));
  /* the two live on different native scales, so plot each as its own z within view */
  const lv = rs.map(r => r.zL).filter(isNum), ov = rs.map(r => r.zO).filter(isNum);
  const srt = rs.slice().filter(r => isNum(r.zL) && isNum(r.zO)).sort((a, b) => a.zO - b.zO);
  const w = 400, h = 176, padL = 30, padB = 26, padT = 14;
  let body;
  if (srt.length < 4) body = '<div class="empty">Too few observations at this filter.</div>';
  else {
    const pw = w - padL - 12, ph = h - padT - padB;
    const all = lv.concat(ov);
    const lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    const X = i => padL + (i / (srt.length - 1)) * pw;
    const Y = v => padT + ph - ((v - lo) / ((hi - lo) || 1)) * ph;
    const path = key => srt.map((r, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(r[key]).toFixed(1)).join(" ");
    const area = key => path(key) + " L" + X(srt.length - 1).toFixed(1) + " " + (padT + ph) + " L" + padL + " " + (padT + ph) + " Z";
    body = svgOpen(w, h) +
      '<defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#13D9FF" stop-opacity=".22"/><stop offset="1" stop-color="#13D9FF" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="go" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#14D7A2" stop-opacity=".20"/><stop offset="1" stop-color="#14D7A2" stop-opacity="0"/></linearGradient></defs>';
    for (let i = 0; i <= 3; i++) body += line(padL, padT + (ph * i) / 3, padL + pw, padT + (ph * i) / 3, "#0E2436", 1, .6);
    body += '<path d="' + area("zL") + '" fill="url(#gl)"/>';
    body += '<path d="' + area("zO") + '" fill="url(#go)"/>';
    body += '<path d="' + path("zL") + '" fill="none" stroke="#13D9FF" stroke-width="1.5" stroke-linejoin="round"/>';
    body += '<path d="' + path("zO") + '" fill="none" stroke="#14D7A2" stroke-width="1.5" stroke-linejoin="round"/>';
    body += txt(padL - 5, Y(hi) + 4, fmt(hi, 1), { size: 8, anchor: "end", fill: "var(--tx-4)", mono: 1 });
    body += txt(padL - 5, Y(lo) + 4, fmt(lo, 1), { size: 8, anchor: "end", fill: "var(--tx-4)", mono: 1 });
    body += txt(padL, h - 8, "firm-years ordered by z(OPS) →", { size: 8.5, fill: "var(--tx-4)" });
    body += "</svg>";
  }
  const gap = lAll - oAll;
  return '<div class="card">' +
    cardHead("LPS vs OPS overview", ICON.overview, "n = " + rs.length) + body +
    '<div class="legend"><span><i style="background:#13D9FF"></i>z(LPS) — disclosure</span>' +
      '<span><i style="background:#14D7A2"></i>z(OPS) — performance</span></div>' +
    '<div class="grid g3" style="margin-top:11px;gap:9px">' +
      '<div><div style="font-family:var(--mono);font-size:16px;color:var(--cyan)">' + fmt(lAll, 3) + "</div>" +
        '<div style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:700">Avg LPS</div></div>' +
      '<div><div style="font-family:var(--mono);font-size:16px;color:var(--teal)">' + fmt(oAll, 3) + "</div>" +
        '<div style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:700">Avg OPS</div></div>' +
      '<div><div style="font-family:var(--mono);font-size:16px;color:var(--tx-2)">' + sgn(gap, 3) + "</div>" +
        '<div style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:700">Raw gap</div></div>' +
    "</div>" +
    '<div class="cfoot"><b>The raw gap is not the score.</b> LPS and OPS are on different native ' +
      "scales (LPS is a FinBERT sentiment value, OPS a weighted composite), so subtracting them raw " +
      "is meaningless. GDS subtracts the <b>standardised</b> values within each fiscal year — the " +
      "chart plots those z-scores, which is why both series share one axis.</div>" +
  "</div>";
}

function sectorHeatCard(rs) {
  const secs = Array.from(new Set(rs.map(r => r.s))).sort();
  const rowsH = secs.map(s => {
    const sub = rs.filter(r => r.s === s);
    const g = mean(sub.map(r => r.G));
    const col = g >= bandSD(null) ? "var(--red)" : g >= 0 ? "var(--amber)" : g > -bandSD(null) ? "var(--blue)" : "var(--teal)";
    const op = Math.min(.30, .07 + Math.abs(g) / 8);
    const small = SECTOR_N[s] < 5;
    return "<tr class='click' data-sector='" + esc(s) + "'><td class='co'>" + esc(s) +
      (small ? ' <span style="color:var(--amber)" title="Peer group too small for stable benchmarking">*</span>' : "") +
      '</td><td class="n">' + sub.length + "</td>" +
      '<td class="n">' + fmt(mean(sub.map(r => r.LPS).filter(isNum)), 3) + "</td>" +
      '<td class="n">' + fmt(mean(sub.map(r => r.OPS).filter(isNum)), 3) + "</td>" +
      '<td class="n" style="color:' + col + ';font-weight:600;background:' +
        col.replace("var(--", "rgba(").replace(")", "") + ""  + '">' + "</td></tr>";
  });
  /* build the GDS cell separately so the tint is a real rgba */
  const body = secs.map(s => {
    const sub = rs.filter(r => r.s === s);
    const g = mean(sub.map(r => r.G));
    const k = g >= bandSD(null) ? "high" : g >= 0 ? "mod" : g > -bandSD(null) ? "low" : "align";
    const tint = { high: "255,95,107", mod: "255,177,62", low: "38,140,255", align: "20,215,162" }[k];
    const op = Math.min(.26, .06 + Math.abs(g) / 9);
    const small = SECTOR_N[s] < 5;
    return '<tr class="click" data-sector="' + esc(s) + '"><td class="co">' + esc(s) +
      (small ? ' <span style="color:var(--amber)" title="Fewer than 5 firms — peer group too small for stable benchmarking">*</span>' : "") +
      '</td><td class="n">' + sub.length +
      '</td><td class="n">' + fmt(mean(sub.map(r => r.LPS).filter(isNum)), 3) +
      '</td><td class="n">' + fmt(mean(sub.map(r => r.OPS).filter(isNum)), 3) +
      '</td><td class="n" style="color:' + sigCol(k) + ';font-weight:700;background:rgba(' + tint + "," + op.toFixed(2) + ')">' +
      sgn(g, 2) + "</td></tr>";
  }).join("");
  return '<div class="card">' +
    cardHead("Sector divergence heatmap", ICON.segment, secs.length + " sectors in view") +
    '<div class="tw" style="max-height:330px"><table><thead><tr>' +
      "<th>Sector</th><th class='n'>Obs</th><th class='n'>Avg LPS</th><th class='n'>Avg OPS</th><th class='n'>Avg GDS</th>" +
    "</tr></thead><tbody>" + (body || '<tr><td colspan="5" class="empty">No sectors in view.</td></tr>') +
    "</tbody></table></div>" +
    '<div class="cfoot"><b>*</b> fewer than 5 firms — peer group too small for stable benchmarking; ' +
      "a sector mean there is effectively one or two companies. Cell tint is proportional to |GDS|. " +
      "Sector means control for nothing except sector membership.</div>" +
  "</div>";
}

function marketInsightCard(rs) {
  const groups = SIGNALS.map(s => {
    const v = rs.filter(r => r.sig === s.k && isNum(r.car1)).map(r => r.car1);
    return { k: s.k, lab: s.lab, col: s.col, n: v.length, m: v.length ? mean(v) : null };
  });
  const hi = groups.find(g => g.k === "high");
  const withN = groups.filter(g => g.n > 0);
  const mono = (() => {
    const v = withN.map(g => g.m);
    if (v.length < 3) return null;
    let inc = true, dec = true;
    for (let i = 1; i < v.length; i++) { if (v[i] < v[i - 1]) inc = false; if (v[i] > v[i - 1]) dec = false; }
    return inc || dec;
  })();
  const rowsH = groups.map(g =>
    '<div class="rowline" style="cursor:default">' +
      '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:' + g.col + ';flex:none"></span>' +
      '<span class="nm" style="font-weight:500;color:var(--tx-2)">' + g.lab + "</span>" +
      '<span style="font-family:var(--mono);font-size:9.5px;color:var(--tx-4)">n=' + g.n + "</span>" +
      '<span class="sc" style="color:' + (g.m == null ? "var(--tx-4)" : g.m < 0 ? "var(--red)" : "var(--teal)") + '">' +
        (g.m == null ? "—" : sgn(g.m * 100, 2) + "%") + "</span>" +
    "</div>").join("");
  return '<div class="card">' +
    cardHead("Market reaction insights", ICON.market, "CAR (−1,+1) · n = " + rs.filter(r => isNum(r.car1)).length) +
    '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +
      "<div>" + ring(Math.min(1, Math.abs((hi && hi.m) || 0) * 40), (hi && hi.m != null && hi.m < 0) ? "var(--red)" : "var(--teal)", 92,
        (hi && hi.m != null) ? sgn(hi.m * 100, 2) + "%" : "n/a") + "</div>" +
      '<div style="flex:1;min-width:130px">' +
        '<div style="font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4);font-weight:700">' +
          "Mean abnormal return</div>" +
        '<div style="font-size:10.5px;color:var(--tx-3);margin-top:3px">High-divergence group, 3-day window</div>' +
      "</div>" +
    "</div>" +
    '<div style="margin-top:10px">' + rowsH + "</div>" +
    '<div class="note ' + (mono ? "cy" : "am") + '" style="margin-top:11px">' +
      (mono
        ? "<b>Observation.</b> Mean abnormal return orders monotonically across the divergence groups in this view."
        : "<b>No monotonic pattern is present in this data.</b> Mean abnormal return does <b>not</b> " +
          "decline as divergence rises — the group means move without order, which is what noise looks like. " +
          "A dependence-robust test of the underlying relationship is <b>not significant</b> (p &gt; 0.6 with " +
          "standard errors clustered by firm or by event date).") +
    "</div>" +
    '<div class="cfoot">An analytical observation, <b>not a causal claim</b>. The event date is the ' +
      "annual-report publication date carrying the BRSR, so the reaction bundles every other disclosure " +
      "released the same day and <b>cannot isolate the BRSR</b>. Group differences here are not " +
      "statistically distinguishable.</div>" +
  "</div>";
}

function dataQualityCard(rs) {
  const comps = ["renew", "wdir", "wemp", "ctrl"];
  let have = 0, tot = 0;
  rs.forEach(r => { const o = OPS_BY[r.c + "|" + r.y]; comps.forEach(k => { tot++; if (o && isNum(o[k])) have++; }); });
  const completeness = tot ? have / tot : NaN;
  const coverage = rs.length ? rs.filter(r => isNum(r.car1)).length / rs.length : NaN;
  const themeCov = rs.length ? rs.filter(r => TOP_BY[r.c + "|" + r.y]).length / rs.length : NaN;
  const firms = new Set(rs.map(r => r.c)).size;
  const balance = firms ? rs.length / (firms * YEARS.length) : NaN;
  const items = [
    { l: "Market-event coverage", v: coverage, d: "firm-years with a CAR" },
    { l: "Panel balance", v: balance, d: "of firm × year cells present" },
    { l: "Theme coverage", v: themeCov, d: "firm-years with topic shares" },
    { l: "OPS component completeness", v: completeness, d: "of component cells disclosed" },
    { l: "Timeliness", v: null, d: "no reporting-lag field in this data set" }
  ];
  const scored = items.filter(i => isNum(i.v));
  const composite = scored.length ? mean(scored.map(i => i.v)) : NaN;
  return '<div class="card">' +
    cardHead("Data quality", ICON.quality, "computed from this view") +
    '<div style="display:flex;align-items:baseline;gap:8px">' +
      '<div style="font-family:var(--mono);font-size:28px;font-weight:600;color:var(--teal)">' +
        fmt(composite * 100, 1) + '</div><div style="font-size:12px;color:var(--tx-3)">/100</div>' +
    "</div>" +
    '<div style="font-size:9.5px;color:var(--tx-3);margin-bottom:9px">' +
      "unweighted mean of the <b>" + scored.length + "</b> dimensions below that this data can measure</div>" +
    '<div class="bar" style="margin-bottom:10px"><i style="width:' + fmt(composite * 100, 1) +
      '%;background:linear-gradient(90deg,var(--teal),var(--cyan))"></i></div>' +
    items.map(i =>
      '<div class="dqrow"><span class="ok">' + (isNum(i.v) ? "✓" : "–") + "</span>" +
      '<span class="lb">' + i.l + '<br><span style="font-size:9px;color:var(--tx-4)">' + i.d + "</span></span>" +
      '<span class="' + (isNum(i.v) ? "vl" : "na") + '">' + (isNum(i.v) ? pct(i.v, 1) : "Not available") + "</span></div>").join("") +
    '<div class="cfoot">Timeliness is <b>not computable</b> from this data set — no publication-lag ' +
      "field exists — so it is shown as not available rather than estimated, and it is excluded from " +
      "the composite.</div>" +
  "</div>";
}

/* ---------------- RANKING ---------------- */
const RANK_COLS = [
  { k: "rank", t: "#", n: 1, sort: false },
  { k: "c", t: "Company" },
  { k: "s", t: "Sector" },
  { k: "y", t: "Year" },
  { k: "zL", t: "z(LPS)", n: 1 },
  { k: "zO", t: "z(OPS)", n: 1 },
  { k: "G", t: "GDS", n: 1 },
  { k: "Gadj", t: "Peer-adj GDS", n: 1 },
  { k: "sig", t: "Signal" }
];
V.ranking = function () {
  const rs = rows().slice();
  const dir = State.sortDir, key = State.sortKey;
  rs.sort((a, b) => {
    let x = a[key], y = b[key];
    if (key === "sig") { x = SIGNALS.findIndex(s => s.k === x); y = SIGNALS.findIndex(s => s.k === y); }
    if (typeof x === "string") return dir * x.localeCompare(y);
    if (!isNum(x)) return 1; if (!isNum(y)) return -1;
    return dir * (x - y);
  });
  const head = RANK_COLS.map(c =>
    "<th" + (c.n ? ' class="n' + (c.sort === false ? "" : " srt") + '"' : ' class="srt"') +
    (c.sort === false ? "" : ' data-sort="' + c.k + '" tabindex="0" role="button"') + ">" + c.t +
    (key === c.k ? '<span class="ind">' + (dir > 0 ? "▲" : "▼") + "</span>" : "") + "</th>").join("");
  const body = rs.map((r, i) =>
    '<tr class="click" data-firm="' + esc(r.c) + '" data-year="' + esc(r.y) + '">' +
      '<td class="n" style="color:var(--tx-4)">' + (i + 1) + "</td>" +
      '<td class="co">' + esc(r.c) + "</td>" +
      "<td>" + esc(r.s) + (SECTOR_N[r.s] < 5 ? ' <span style="color:var(--amber)">*</span>' : "") + "</td>" +
      "<td>" + esc(YLAB[r.y] || r.y) + "</td>" +
      '<td class="n">' + sgn(r.zL, 2) + "</td>" +
      '<td class="n">' + sgn(r.zO, 2) + "</td>" +
      '<td class="n" style="color:' + sigCol(r.sig) + ';font-weight:700">' + sgn(r.G, 1) + "</td>" +
      '<td class="n">' + sgn(r.Gadj, 1) + "</td>" +
      "<td>" + sigPill(r.sig) + "</td>" +
    "</tr>").join("");
  return '<div class="card">' +
    cardHead("Divergence league table", ICON.ranking,
      rs.length + " firm-years · click any row for the company panel") +
    (rs.length
      ? '<div class="tw" style="max-height:calc(100vh - 330px)"><table id="rankTable"><thead><tr>' +
        head + "</tr></thead><tbody>" + body + "</tbody></table></div>"
      : '<div class="empty">No firm-years match the current filter.</div>') +
    '<div class="cfoot"><b>GDS and peer-adjusted GDS are shown to 1 decimal place.</b> That is the ' +
      "precision the score supports — differences below about 0.3 are not meaningful, so neighbouring " +
      "rows should not be read as distinguishable. z-scores are shown to 2 dp as construction detail. " +
      "<b>*</b> sector has fewer than 5 firms. Sorting changes the ordering only; no value is recomputed.</div>" +
  "</div>";
};

/* ---------------- DIVERGENCE MATRIX ---------------- */
V.matrix = function () {
  const rs = rows();
  const q = { hd_lp: 0, hd_hp: 0, ld_lp: 0, ld_hp: 0 };
  rs.forEach(r => {
    if (!isNum(r.zL) || !isNum(r.zO)) return;
    if (r.zL >= 0 && r.zO < 0) q.hd_lp++;
    else if (r.zL >= 0 && r.zO >= 0) q.hd_hp++;
    else if (r.zL < 0 && r.zO < 0) q.ld_lp++;
    else q.ld_hp++;
  });
  const out = rs.filter(r => {
    const t = YSTAT[r.y]; return t && (r.G < t.q025 || r.G > t.q975);
  }).sort((a, b) => Math.abs(b.G) - Math.abs(a.G));
  const qcard = (t1, t2, n, col, d) =>
    '<div class="card" style="padding:11px 12px">' +
      '<div style="font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:' + col + '">' +
        t1 + "<br>" + t2 + "</div>" +
      '<div style="font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px">' + n + "</div>" +
      '<div style="font-size:9.5px;color:var(--tx-4);margin-top:2px">' + d + "</div></div>";
  return '<div class="card glow-cyan">' +
      cardHead("Divergence matrix — z(LPS) against z(OPS)", ICON.matrix,
        rs.length + " firm-years · hover a node, click to open") +
      universeMap(rs, 1080, 560) +
      '<div class="legend">' + SIGNALS.map(s =>
        '<span><i style="background:' + s.col + '"></i>' + s.lab + " — " + s.d + "</span>").join("") + "</div>" +
    "</div>" +
    '<div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:13px">' +
      qcard("High disclosure", "Low performance", q.hd_lp, "var(--red)", "language ahead on both axes") +
      qcard("High disclosure", "High performance", q.hd_hp, "var(--cyan)", "both above cohort mean") +
      qcard("Low disclosure", "Low performance", q.ld_lp, "var(--tx-3)", "both below cohort mean") +
      qcard("Low disclosure", "High performance", q.ld_hp, "var(--teal)", "performance ahead of language") +
    "</div>" +
    '<div class="card" style="margin-top:13px">' +
      cardHead("Outliers — outside the 2.5 / 97.5 percentile of their own fiscal year", ICON.quality,
        out.length + " flagged") +
      (out.length
        ? '<div class="tw" style="max-height:280px"><table><thead><tr><th>Company</th><th>Sector</th>' +
          "<th>Year</th><th class='n'>GDS</th><th class='n'>z(LPS)</th><th class='n'>z(OPS)</th><th>Signal</th>" +
          "</tr></thead><tbody>" + out.map(r =>
            '<tr class="click" data-firm="' + esc(r.c) + '" data-year="' + esc(r.y) + '">' +
            '<td class="co">' + esc(r.c) + "</td><td>" + esc(r.s) + "</td><td>" + esc(YLAB[r.y] || r.y) +
            '</td><td class="n" style="color:' + sigCol(r.sig) + ';font-weight:700">' + sgn(r.G, 2) +
            '</td><td class="n">' + sgn(r.zL, 2) + '</td><td class="n">' + sgn(r.zO, 2) +
            "</td><td>" + sigPill(r.sig) + "</td></tr>").join("") + "</tbody></table></div>"
        : '<div class="empty">No firm-year in this view falls outside its own year’s 95% band.</div>') +
      '<div class="cfoot"><b>A statistical outlier is not a data error</b>, and nothing flagged here is ' +
        "excluded, winsorised or corrected. The reverse also holds: a genuine data error sitting inside " +
        "the 95% band would never be flagged. Percentile cut-offs are a descriptive convention.</div>" +
    "</div>";
};

/* ---------------- SEGMENTATION ---------------- */
V.segment = function () {
  const rs = rows();
  const secs = Array.from(new Set(rs.map(r => r.s))).sort();
  const cards = secs.map(s => {
    const sub = rs.filter(r => r.s === s);
    const g = mean(sub.map(r => r.G));
    const k = signalOf(g, State.year === "ALL" ? null : State.year);
    const nf = new Set(sub.map(r => r.c)).size;
    return '<div class="card click" data-sector="' + esc(s) + '" style="cursor:pointer;padding:12px">' +
      '<div style="display:flex;align-items:center;gap:7px">' +
        '<span style="width:7px;height:7px;border-radius:50%;background:' + sigCol(k) + ';flex:none"></span>' +
        '<span style="font-size:12px;font-weight:700;color:var(--tx);flex:1;min-width:0;overflow:hidden;' +
          'text-overflow:ellipsis;white-space:nowrap">' + esc(s) + "</span>" +
        (nf < 5 ? '<span style="font-size:8.5px;color:var(--amber);font-weight:700">SMALL n</span>' : "") +
      "</div>" +
      '<div style="font-family:var(--mono);font-size:21px;font-weight:600;color:' + sigCol(k) + ';margin-top:7px">' +
        sgn(g, 2) + "</div>" +
      '<div style="font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx-4);font-weight:700">Avg GDS</div>' +
      '<div class="grid g3" style="margin-top:9px;gap:6px">' +
        ["Firms|" + nf, "Avg LPS|" + fmt(mean(sub.map(r => r.LPS).filter(isNum)), 3),
         "Avg OPS|" + fmt(mean(sub.map(r => r.OPS).filter(isNum)), 3)].map(p => {
          const q = p.split("|");
          return '<div><div style="font-family:var(--mono);font-size:11.5px;color:var(--tx-2)">' + q[1] + "</div>" +
            '<div style="font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-4);font-weight:700">' +
            q[0] + "</div></div>"; }).join("") +
      "</div></div>";
  }).join("");
  /* thematic — full sample, filter-independent */
  const th = DATA.themes.map(t =>
    "<tr><td class='co'>" + esc(t.t) + "</td>" +
    '<td class="n" style="color:' + (t.r >= 0 ? "var(--red)" : "var(--teal)") + '">' + sgn(t.r, 3) + "</td>" +
    '<td class="n">' + fmt(t.p, 4) + "</td>" +
    '<td class="n">' + sgn(t.radj, 3) + "</td>" +
    '<td class="n">' + fmt(t.padj, 4) + "</td>" +
    "<td>" + (t.surv
      ? '<span style="color:var(--teal);font-weight:700">YES</span>'
      : '<span style="color:var(--tx-4)">NO</span>') + "</td></tr>").join("");
  return '<div class="card"><div class="ctitle"><svg viewBox="0 0 24 24">' + ICON.segment +
      "</svg><span>Sector intelligence</span><span class='spacer'></span>" +
      '<span class="chint">' + secs.length + " sectors · click a card to filter</span></div>" +
      '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(215px,1fr))">' +
      (cards || '<div class="empty">No sectors in view.</div>') + "</div></div>" +
    '<div class="card" style="margin-top:13px">' +
      cardHead("Thematic associations", ICON.method,
        "full sample · n = " + META.n_firmyears + " · filters do not apply") +
      '<div class="note cy" style="margin-bottom:11px"><b>Global analysis.</b> These eight ' +
        "correlations are computed on the full sample and <b>do not respond to the Year or Sector " +
        "filter</b>. The counter in the filter bar shows what the filter selects; it is not the n " +
        "behind this table.</div>" +
      '<div class="tw"><table><thead><tr><th>Theme</th><th class="n">r with GDS</th><th class="n">p</th>' +
      '<th class="n">r sector-adj</th><th class="n">p sector-adj</th><th>Survives adjustment?</th>' +
      "</tr></thead><tbody>" + th + "</tbody></table></div>" +
      '<div class="cfoot"><b>Association, not deflection.</b> A theme share is the proportion of a ' +
        "firm's disclosure devoted to that theme; nothing here identifies a strategy, a choice or an " +
        "intent. Shares are <b>compositional</b> (they sum to 1) and firm-years are <b>clustered by " +
        "firm</b>, so these simple p-values are optimistic — the audited dashboard carries the " +
        "cluster-robust and log-ratio versions.</div>" +
    "</div>";
};

/* ---------------- PEER BENCHMARK ---------------- */
V.peer = function () {
  const rs = rows().filter(r => isNum(r.Gadj));
  const elig = rs.filter(r => SECTOR_N[r.s] >= 5);
  const small = rs.filter(r => SECTOR_N[r.s] < 5);
  const srt = elig.slice().sort((a, b) => Math.abs(b.Gadj) - Math.abs(a.Gadj));
  const body = srt.slice(0, 40).map(r =>
    '<tr class="click" data-firm="' + esc(r.c) + '" data-year="' + esc(r.y) + '">' +
      '<td class="co">' + esc(r.c) + "</td><td>" + esc(r.s) + "</td><td>" + esc(YLAB[r.y] || r.y) + "</td>" +
      '<td class="n">' + sgn(r.G, 2) + '</td><td class="n" style="color:' + sigCol(r.sig) + ';font-weight:700">' +
      sgn(r.Gadj, 2) + '</td><td class="n" style="color:var(--tx-4)">' + sgn(r.Gadj - r.G, 2) + "</td>" +
      "<td>" + sigPill(r.sig) + "</td></tr>").join("");
  return '<div class="card glow-purple">' +
      cardHead("Peer adjustment — what it does and does not remove", ICON.peer,
        elig.length + " eligible firm-years") +
      '<div class="eq" style="justify-content:flex-start">' +
        '<div class="box"><div class="t">Peer-adjusted GDS</div><div class="v">Gadj</div></div>' +
        '<span class="op">=</span>' +
        '<div class="box"><div class="t">Raw GDS</div><div class="v">G</div></div>' +
        '<span class="op">−</span>' +
        '<div class="box"><div class="t">Sector-year mean</div><div class="v">mean(G | sector, year)</div></div>' +
      "</div>" +
      '<div class="note" style="margin-top:11px"><b>Peer adjustment removes the sector-year mean. ' +
        "That is all it does.</b> It does not control for size, profitability, leverage, capital " +
        "intensity, regulatory exposure, reporting quality, governance, media attention or corporate " +
        "events. It is a peer demean for presentation, <b>not a multivariate control</b>, and it does " +
        "not eliminate omitted-variable bias.</div>" +
      '<div class="note am" style="margin-top:9px"><b>Minimum peer-group size: 5 firms.</b> ' +
        small.length + " firm-years in view sit in sectors below that threshold and are <b>excluded " +
        "from this ranking</b> — at n = 2, benchmarking means comparing a firm against one other " +
        "company. Their scores remain visible on every other page.</div>" +
    "</div>" +
    '<div class="card" style="margin-top:13px">' +
      cardHead("Most extreme after peer adjustment", ICON.ranking, "top 40 by |peer-adjusted GDS|") +
      (srt.length
        ? '<div class="tw" style="max-height:calc(100vh - 470px)"><table><thead><tr><th>Company</th>' +
          "<th>Sector</th><th>Year</th><th class='n'>Raw GDS</th><th class='n'>Peer-adj GDS</th>" +
          "<th class='n'>Difference</th><th>Signal</th></tr></thead><tbody>" + body + "</tbody></table></div>"
        : '<div class="empty">No peer-benchmarkable firm-years at this filter.</div>') +
      '<div class="cfoot">Firms that stay extreme after the sector mean is removed carry divergence ' +
        "that is <b>firm-specific rather than an industry effect</b>. The difference column is the " +
        "sector-year mean that was subtracted.</div>" +
    "</div>";
};

/* ---------------- MARKET REACTION ---------------- */
const WINDOWS = [
  { k: "car1", lab: "(−1, +1)", d: "3 trading days around publication" },
  { k: "car2", lab: "(0, +5)", d: "publication day to +5" },
  { k: "car3", lab: "(−5, +5)", d: "11 trading days" },
  { k: "car4", lab: "(−5, +20)", d: "26 trading days — loses the most observations" }
];
V.market = function () {
  const rs = rows();
  const winBody = WINDOWS.map(w => {
    const v = rs.map(r => r[w.k]).filter(isNum);
    const m = v.length ? mean(v) : null;
    return "<tr><td class='co'>" + w.lab + '<br><span style="font-size:9px;color:var(--tx-4)">' + w.d + "</span></td>" +
      '<td class="n">' + v.length + "</td>" +
      '<td class="n" style="color:' + (m == null ? "var(--tx-4)" : m < 0 ? "var(--red)" : "var(--teal)") + ';font-weight:700">' +
        (m == null ? "—" : sgn(m * 100, 3) + "%") + "</td>" +
      '<td class="n">' + (v.length ? sgn(quant(v, .5) * 100, 3) + "%" : "—") + "</td>" +
      '<td class="n">' + (v.length > 1 ? fmt(sd(v, 1) * 100, 2) + "%" : "—") + "</td></tr>";
  }).join("");
  const bySig = SIGNALS.map(s => {
    const v = rs.filter(r => r.sig === s.k && isNum(r.car1)).map(r => r.car1);
    return { s: s, n: v.length, m: v.length ? mean(v) : null };
  });
  const maxAbs = Math.max.apply(null, bySig.map(g => Math.abs(g.m || 0)).concat([.001]));
  const bars = bySig.map(g => {
    const w = 260, h = 26, mid = w / 2;
    const len = g.m == null ? 0 : (Math.abs(g.m) / maxAbs) * (mid - 10);
    return '<div style="display:flex;align-items:center;gap:9px;padding:5px 0">' +
      '<span style="width:112px;font-size:10.5px;color:' + g.s.col + ';font-weight:600">' + g.s.lab + "</span>" +
      svgOpen(w, h).replace('style="display:block;width:100%;height:auto"', 'style="display:block;width:' + w + 'px;height:' + h + 'px;flex:none"') +
        line(mid, 2, mid, h - 2, "var(--bd)", 1) +
        (g.m == null ? "" : rect(g.m < 0 ? mid - len : mid, 7, len, 12, g.s.col, { rx: 2, op: .85 })) +
      "</svg>" +
      '<span style="font-family:var(--mono);font-size:11.5px;color:' +
        (g.m == null ? "var(--tx-4)" : g.m < 0 ? "var(--red)" : "var(--teal)") + '">' +
        (g.m == null ? "—" : sgn(g.m * 100, 2) + "%") + "</span>" +
      '<span style="font-family:var(--mono);font-size:9.5px;color:var(--tx-4)">n=' + g.n + "</span></div>";
  }).join("");
  return '<div class="grid g2">' +
      '<div class="card">' + cardHead("Event-study windows", ICON.market, "mean CAR per window") +
        '<div class="tw"><table><thead><tr><th>Window</th><th class="n">n</th><th class="n">Mean CAR</th>' +
        '<th class="n">Median</th><th class="n">SD</th></tr></thead><tbody>' + winBody + "</tbody></table></div>" +
        '<div class="cfoot">Sample size falls as the window widens — the (−5,+20) window loses the most ' +
          "observations and is the <b>least comparable</b> of the four.</div>" +
      "</div>" +
      '<div class="card">' + cardHead("Mean CAR (−1,+1) by divergence signal", ICON.matrix,
        "n = " + rs.filter(r => isNum(r.car1)).length) + bars +
        '<div class="note am" style="margin-top:10px"><b>Read the ordering, then discount it.</b> ' +
          "These group means are <b>not statistically distinguishable</b>: with standard errors " +
          "clustered by firm or by event date the underlying relationship returns p &gt; 0.6. " +
          "Any apparent pattern across the four groups is within noise.</div>" +
      "</div>" +
    "</div>" +
    '<div class="card" style="margin-top:13px">' + cardHead("Event-study methodology", ICON.method,
      "quoted from the project methodology file") +
      '<div class="grid g2" style="gap:9px">' +
        [["Market model", "OLS following MacKinlay (1997)"],
         ["Estimation window", "−250 to −11 trading days"],
         ["Event window", "−5 to +20 trading days"],
         ["Benchmark", "NIFTY 500 — deliberately not NIFTY 100, since every sample firm is a NIFTY 100 constituent"],
         ["Event date", "the firm's BRSR publication date (the annual report carrying it)"],
         ["Price source", "daily closing prices via yfinance"]].map(p =>
          '<div class="dcell"><div class="t">' + p[0] + '</div><div style="font-size:11px;color:var(--tx-2);' +
          'margin-top:4px;line-height:1.45">' + p[1] + "</div></div>").join("") +
      "</div>" +
      '<div class="note rd" style="margin-top:11px"><b>Critical limitation.</b> The BRSR is published ' +
        "<b>inside the annual report</b>, so the event date carries the financial statements, the " +
        "directors' report, the management discussion, the auditor's report and the BRSR " +
        "<b>simultaneously</b>. Any price move around that date responds to the whole bundle. " +
        "<b>This design cannot isolate the BRSR component</b>, and nothing on this page should be read " +
        "as evidence that markets react specifically to disclosure–performance divergence, still less " +
        "to greenwashing. It is a design limitation, not a sample-size one.</div>" +
      '<div class="cfoot">Also absent: no placebo-event test, no industry-adjusted-return robustness ' +
        "check, and no clustered standard errors in the original specification (HC3 corrects " +
        "heteroscedasticity, not the cross-sectional correlation created by firms sharing an event date).</div>" +
    "</div>";
};

/* ---------------- WHAT-IF ---------------- */
V.whatif = function () {
  const fl = firmRows();
  const pick = State.wiFirm && fl.find(f => f.c === State.wiFirm) ? State.wiFirm : (fl[0] && fl[0].c);
  const f = fl.find(x => x.c === pick);
  const opts = fl.map(x => '<option value="' + esc(x.c) + '"' + (x.c === pick ? " selected" : "") + ">" +
    esc(x.c) + " (" + sgn(x.G, 2) + ")</option>").join("");
  return '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)">' +
      '<div class="card glow-cyan">' + cardHead("Scenario inputs", ICON.whatif, "simulate a shift") +
        '<div class="fgrp" style="margin-bottom:12px"><span class="flab">Company</span>' +
          '<select id="wiFirm" style="flex:1">' + (opts || "<option>—</option>") + "</select></div>" +
        '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;' +
          'font-size:10px;color:var(--tx-3);margin-bottom:5px"><span class="flab">Δ z(LPS) — disclosure</span>' +
          '<span class="mono" id="dlVal" style="font-family:var(--mono);color:var(--cyan)">+0.00</span></div>' +
          '<input type="range" id="dl" min="-200" max="200" step="5" value="0" style="width:100%"></div>' +
        '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;' +
          'font-size:10px;color:var(--tx-3);margin-bottom:5px"><span class="flab">Δ z(OPS) — performance</span>' +
          '<span class="mono" id="doVal" style="font-family:var(--mono);color:var(--teal)">+0.00</span></div>' +
          '<input type="range" id="do" min="-200" max="200" step="5" value="0" style="width:100%"></div>' +
        '<button class="pillbtn" id="wiReset">Reset scenario</button>' +
        '<div class="cfoot"><b>Simulated GDS = starting GDS + Δz(LPS) − Δz(OPS).</b> ' +
          "This is the identity the score is built on, applied to a hypothetical shift. " +
          "<b>Nothing here changes any stored value</b>, and a simulated score is not a forecast — " +
          "it answers &ldquo;what would the score be if these inputs moved&rdquo;, not &ldquo;will they&rdquo;.</div>" +
      "</div>" +
      '<div class="card" id="wiOut"></div>' +
    "</div>";
};
function renderWhatIf() {
  const sel = $("#wiFirm"), dl = $("#dl"), dr = $("#do"), out = $("#wiOut");
  if (!sel || !out) return;
  const fl = firmRows();
  function paint() {
    const f = fl.find(x => x.c === sel.value);
    if (!f) { out.innerHTML = '<div class="empty">Select a company.</div>'; return; }
    const a = Number(dl.value) / 100, b = Number(dr.value) / 100;
    $("#dlVal").textContent = sgn(a, 2); $("#doVal").textContent = sgn(b, 2);
    const sim = f.G + a - b;
    const k0 = f.sig, k1 = signalOf(sim, State.year === "ALL" ? null : State.year);
    const moved = k0 !== k1;
    out.innerHTML =
      cardHead("Simulated outcome", ICON.overview, esc(f.c)) +
      '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;padding:8px 0">' +
        '<div style="text-align:center"><div style="font-family:var(--mono);font-size:26px;font-weight:600;' +
          'color:var(--tx-3)">' + sgn(f.G, 2) + "</div>" +
          '<div style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:700">Current GDS</div></div>' +
        '<div style="font-size:22px;color:var(--cyan)">→</div>' +
        '<div style="text-align:center"><div id="simVal" style="font-family:var(--mono);font-size:40px;' +
          'font-weight:600;color:' + sigCol(k1) + ';text-shadow:0 0 26px ' + sigCol(k1) + '55">' + sgn(sim, 2) + "</div>" +
          '<div style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:700">Simulated GDS</div></div>' +
      "</div>" +
      '<div style="text-align:center;margin:6px 0 12px">' + sigPill(k1) +
        (moved ? '<div style="font-size:10.5px;color:var(--amber);margin-top:7px">Signal changes from <b>' +
          SIGMAP[k0].lab + "</b> to <b>" + SIGMAP[k1].lab + "</b></div>"
               : '<div style="font-size:10.5px;color:var(--tx-4);margin-top:7px">Signal unchanged</div>') + "</div>" +
      '<div class="dgrid">' +
        '<div class="dcell"><div class="t">Change in GDS</div><div class="v" style="color:' +
          (sim - f.G >= 0 ? "var(--red)" : "var(--teal)") + '">' + sgn(sim - f.G, 2) + "</div></div>" +
        '<div class="dcell"><div class="t">Baseline z(LPS) → z(OPS)</div><div class="v" style="font-size:13px">' +
          sgn(f.zL, 2) + " → " + sgn(f.zO, 2) + "</div></div>" +
      "</div>" +
      '<div class="note cy" style="margin-top:11px"><b>Interpretation.</b> ' +
        (Math.abs(a) < 1e-9 && Math.abs(b) < 1e-9
          ? "No shift applied — the simulated score equals the observed score."
          : esc(f.c) + " would move " + (sim > f.G ? "<b>toward higher divergence</b>" : "<b>toward alignment</b>") +
            " by " + fmt(Math.abs(sim - f.G), 2) + " if its standardised disclosure score moved " + sgn(a, 2) +
            " and its standardised performance score moved " + sgn(b, 2) + ". " +
            (moved ? "That is enough to change its band." : "That is not enough to change its band.")) +
        " Because the score is standardised <b>within a fiscal-year cohort</b>, a real shift of this size " +
        "would also move the cohort and therefore the bands themselves — this simulation holds the " +
        "cohort fixed, which is a simplification.</div>";
  }
  sel.addEventListener("change", () => { State.wiFirm = sel.value; paint(); });
  dl.addEventListener("input", paint); dr.addEventListener("input", paint);
  const rst = $("#wiReset");
  if (rst) rst.addEventListener("click", () => { dl.value = 0; dr.value = 0; paint(); });
  paint();
}
