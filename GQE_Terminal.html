          "figure appears anywhere on this terminal because none exists."],
         ["GDS is a gap between two proxies",
          "LPS is one text-derived disclosure-sentiment measure; OPS is one weighted ESG composite. GDS is " +
          "the arithmetic gap between their z-scores. It is not a comparison of claims against actual " +
          "environmental performance, and it does not license the word &lsquo;greenwasher&rsquo;."],
         ["Two years is not a time series",
          "The panel covers the first two years of mandatory BRSR reporting. There is no trend and no " +
          "trajectory: a change between two points cannot be separated from noise or from firms learning " +
          "a new reporting format."],
         ["No uncertainty propagation, no causal identification",
          "Intervals treat the measured scores as exact because no error model exists. There is no " +
          "exogenous variation, instrument or natural experiment, so no figure here is an effect."],
         ["No per-claim traceability",
          "Lineage resolves to the firm-year — each names its source BRSR PDF — but the pipeline stores no " +
          "text spans or sentence offsets, so a score cannot be traced to a sentence."]].map(p =>
          '<div class="note"><b>' + p[0] + "</b><br>" + p[1] + "</div>").join("") +
      "</div>" +
      '<div class="cfoot">Where a quantity does not exist, this terminal <b>reports its absence rather ' +
        "than supplying a plausible substitute</b>. That is why several questions here end without a number.</div>" +
    "</div>";
};

/* ---------------- METHODOLOGY ---------------- */
V.method = function () {
  const step = (n, t, d, col) =>
    '<div class="card" style="padding:13px;border-left:3px solid ' + col + '">' +
      '<div style="display:flex;align-items:center;gap:8px">' +
      '<span style="font-family:var(--mono);font-size:10px;color:' + col + ';font-weight:700">0' + n + "</span>" +
      '<span style="font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx)">' +
      t + "</span></div>" +
      '<div style="font-size:11px;color:var(--tx-2);margin-top:7px;line-height:1.55">' + d + "</div></div>";
  return '<div class="card glow-cyan">' + cardHead("How GDS is built", ICON.method, "construction chain") +
      '<div class="eq">' +
        '<div class="box"><div class="t">BRSR text</div><div class="v">FinBERT</div></div>' +
        '<span class="op">→</span>' +
        '<div class="box"><div class="t">LPS</div><div class="v">' + fmt(mean(ROWS.map(r => r.LPS).filter(isNum)), 3) + "</div></div>" +
        '<span class="op">→</span>' +
        '<div class="box"><div class="t">z within year</div><div class="v">z(LPS)</div></div>' +
        '<span class="op">−</span>' +
        '<div class="box"><div class="t">z within year</div><div class="v">z(OPS)</div></div>' +
        '<span class="op">=</span>' +
        '<div class="box" style="border-color:rgba(19,217,255,.45)"><div class="t">GDS / DPD</div>' +
          '<div class="v" style="color:var(--cyan)">divergence</div></div>' +
      "</div></div>" +
    '<div class="grid g2" style="margin-top:13px">' +
      step(1, "LPS — language positivity", "Sentiment of the firm's BRSR disclosure text, headline model " +
        "<b>FinBERT</b>. Native scale is a FinBERT score, not a 0–100 index; in this sample it runs " +
        fmt(Math.min.apply(null, ROWS.map(r => r.LPS).filter(isNum)), 3) + " to " +
        fmt(Math.max.apply(null, ROWS.map(r => r.LPS).filter(isNum)), 3) + ". <b>FinBERT is trained on " +
        "financial text</b> and is applied here out of domain to sustainability prose.", "var(--cyan)") +
      step(2, "OPS — operational composite", "A weighted composite of five indicators, MinMax-normalised " +
        "within sample: carbon emissions 30%, energy consumption 20%, board and workforce diversity 20%, " +
        "renewable share 15%, ESG controversies 15%. <b>It is not a purely environmental measure</b> — " +
        "diversity is social and governance, controversies is reputational.", "var(--teal)") +
      step(3, "Standardisation", "Each of LPS and OPS is z-scored <b>within its own fiscal year</b>, so a " +
        "score is relative to that year's cohort. A GDS of 0 means <b>typical for that cohort</b>, not " +
        "&lsquo;no divergence&rsquo;. Scores are not comparable to an absolute benchmark, and a firm's " +
        "score moves when the cohort moves.", "var(--blue)") +
      step(4, "GDS / DPD", "<b>GDS = z(LPS) − z(OPS)</b>. The equal weighting of the two z-scores is a " +
        "<b>convention with no theoretical justification</b> — it is the simplest defensible choice, fixed " +
        "in advance so it could not be tuned to results. The What-if page tests robustness to it, not " +
        "optimality.", "var(--purple)") +
      step(5, "Peer adjustment", "Peer-adjusted GDS subtracts the firm's own <b>sector-year mean</b>. It " +
        "controls for sector and nothing else. A minimum peer group of <b>5 firms</b> applies before a " +
        "comparison is treated as a peer comparison.", "var(--pink)") +
      step(6, "Bands and outliers", "Bands are symmetric at <b>±1 SD</b> of the firm-year's own fiscal " +
        "year (population SD, matching the z-construction). Outliers use each year's empirical " +
        "<b>2.5 / 97.5 percentiles</b>. Both are <b>descriptive conventions</b>, not derived thresholds — " +
        "about 32% of a normal sample falls outside ±1 SD by construction.", "var(--amber)") +
    "</div>" +
    '<div class="card" style="margin-top:13px">' + cardHead("Event study", ICON.market, "MacKinlay (1997)") +
      '<div class="grid g3" style="gap:9px">' +
        [["Model", "Market model, OLS"], ["Estimation window", "−250 to −11 trading days"],
         ["Event window", "−5 to +20 trading days"], ["Benchmark", "NIFTY 500"],
         ["Event date", "BRSR publication date"], ["CAR", "sum of daily abnormal returns"]].map(p =>
        '<div class="dcell"><div class="t">' + p[0] + '</div><div style="font-size:11px;color:var(--tx-2);' +
        'margin-top:4px">' + p[1] + "</div></div>").join("") + "</div></div>" +
    '<div class="card glow-red" style="margin-top:13px">' + cardHead("Important limitations", ICON.whatif) +
      '<div class="grid g2" style="gap:10px">' +
        [["The market test cannot isolate the BRSR",
          "The BRSR is published inside the annual report, so the event date carries every other " +
          "annual-report disclosure at the same time."],
         ["No validated accuracy for the language score",
          "No human-coded benchmark, no precision/recall/F1. Model agreement is not validity."],
         ["Two years, no causal identification",
          "No trend, no trajectory, no exogenous variation. Controls reduce confounding; they do not " +
          "create identification."],
         ["Half the OPS weight is outside this data set",
          "Carbon emissions (30%) and energy consumption (20%) are not in the component file, so OPS " +
          "cannot be re-weighted or decomposed here."]].map(p =>
          '<div class="note rd"><b>' + p[0] + "</b><br>" + p[1] + "</div>").join("") +
      "</div>" +
      '<div class="cfoot"><b>GDS is a relative divergence signal, not proof of greenwashing or intent ' +
        "to mislead.</b> Every association on this terminal is descriptive and exploratory.</div>" +
    "</div>";
};

/* ---------------- COMPANY DRAWER ---------------- */
function openCompany(name, year) {
  const all = ROWS.filter(r => r.c === name);
  if (!all.length) return;
  const r = (year && all.find(x => x.y === year)) || all[all.length - 1];
  const inView = rows();
  const flAll = firmRows(ROWS).sort((a, b) => b.G - a.G);
  const rankAll = flAll.findIndex(f => f.c === name) + 1;
  const flSec = flAll.filter(f => f.s === r.s);
  const rankSec = flSec.findIndex(f => f.c === name) + 1;
  const cell = (t, v, s, col) => '<div class="dcell"><div class="t">' + t + '</div><div class="v"' +
    (col ? ' style="color:' + col + '"' : "") + ">" + v + "</div>" +
    (s ? '<div class="s">' + s + "</div>" : "") + "</div>";
  const carRows = WINDOWS.map(w => {
    const v = r[w.k];
    return "<tr><td>" + w.lab + '</td><td class="n" style="color:' +
      (isNum(v) ? (v < 0 ? "var(--red)" : "var(--teal)") : "var(--tx-4)") + '">' +
      (isNum(v) ? sgn(v * 100, 3) + "%" : "—") + "</td></tr>";
  }).join("");
  const yearsTxt = all.map(x => esc(YLAB[x.y] || x.y) + " " + sgn(x.G, 2)).join("  ·  ");
  $("#drawer").innerHTML =
    '<button class="iconbtn dclose" id="dClose" aria-label="Close">' +
      '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
    "<h3>" + esc(name) + "</h3>" +
    '<div class="dsub">' + esc(r.s) + " · " + esc(YLAB[r.y] || r.y) +
      (SECTOR_N[r.s] < 5 ? ' · <span style="color:var(--amber)">peer group n=' + SECTOR_N[r.s] + "</span>" : "") +
    "</div>" +
    '<div style="margin-top:13px">' + sigPill(r.sig) +
      '<span style="font-size:10px;color:var(--tx-4);margin-left:8px">' + esc(SIGMAP[r.sig] ? SIGMAP[r.sig].d : "") + "</span></div>" +
    '<div class="dgrid">' +
      cell("GDS (DPD)", sgn(r.G, 2), "z(LPS) − z(OPS)", sigCol(r.sig)) +
      cell("Peer-adjusted GDS", sgn(r.Gadj, 2), "sector-year mean removed") +
      cell("z(LPS)", sgn(r.zL, 2), "disclosure, within year") +
      cell("z(OPS)", sgn(r.zO, 2), "performance, within year") +
      cell("Raw LPS", fmt(r.LPS, 4), "FinBERT score") +
      cell("Raw OPS", fmt(r.OPS, 4), "weighted composite") +
      cell("Rank (all firms)", rankAll ? rankAll + " of " + flAll.length : "—", "by firm-mean GDS") +
      cell("Rank in sector", rankSec ? rankSec + " of " + flSec.length : "—", esc(r.s)) +
    "</div>" +
    '<div style="margin-top:14px">' +
      '<div class="ctitle">Both fiscal years</div>' +
      '<div style="font-family:var(--mono);font-size:11.5px;color:var(--tx-2)">' + yearsTxt + "</div>" +
      (all.length === 1 ? '<div style="font-size:10px;color:var(--amber);margin-top:5px">' +
        "Single-year firm — contributes one observation, not two.</div>" : "") +
    "</div>" +
    '<div style="margin-top:14px"><div class="ctitle">Market reaction' +
      (r.evd ? ' <span class="chint">event ' + esc(r.evd) + "</span>" : "") + "</div>" +
      (isNum(r.car1)
        ? '<table style="font-size:11px"><thead><tr><th>Window</th><th class="n">CAR</th></tr></thead>' +
          "<tbody>" + carRows + "</tbody></table>"
        : '<div style="font-size:10.5px;color:var(--tx-4)">No market observation for this firm-year.</div>') +
    "</div>" +
    '<div style="margin-top:14px"><div class="ctitle">OPS components disclosed</div>' +
      (function () {
        const o = OPS_BY[r.c + "|" + r.y];
        const L = [["renew", "Renewable share"], ["wdir", "Women on board"],
                   ["wemp", "Women in workforce"], ["ctrl", "ESG controversies"]];
        return L.map(p => '<div class="dqrow"><span class="lb">' + p[1] + "</span>" +
          '<span class="' + (o && isNum(o[p[0]]) ? "vl" : "na") + '">' +
          (o && isNum(o[p[0]]) ? fmt(o[p[0]], 4) : "Not disclosed") + "</span></div>").join("");
      })() +
    "</div>" +
    '<div class="note" style="margin-top:14px"><b>Interpretation.</b> ' +
      esc(name) + " sits " + (r.G >= 0 ? "<b>above</b>" : "<b>below</b>") + " its " +
      esc(YLAB[r.y] || r.y) + " cohort mean by " + fmt(Math.abs(r.G), 2) + " standardised units" +
      (Math.abs(r.G) < 0.3 ? ", which is inside the practical-indifference band — effectively typical" :
        r.G >= bandSD(r.y) ? ", one of the wider gaps in its cohort" : ", a moderate gap") + ". " +
      (isNum(r.Gadj) ? "After removing its sector-year mean the score is " + sgn(r.Gadj, 2) +
        ", so " + (Math.abs(r.Gadj) < Math.abs(r.G) ? "part of the raw gap is an <b>industry effect</b>"
          : "the gap is <b>firm-specific</b> rather than sectoral") + ". " : "") +
      "<b>This is a relative divergence signal, not a finding of greenwashing.</b></div>";
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  const cb = $("#dClose"); if (cb) { cb.addEventListener("click", closeCompany); cb.focus(); }
}
function closeCompany() {
  $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open");
}

/* ---------------- CHROME ---------------- */
function buildNav() {
  $("#nav").innerHTML = PAGES.map(p =>
    '<button class="navi" data-view="' + p.k + '" role="tab"' +
    (State.view === p.k ? ' aria-current="page"' : "") + '>' +
    '<svg viewBox="0 0 24 24">' + ICON[p.k] + "</svg>" +
    '<span><span class="lab">' + p.lab + '</span><span class="dsc">' + p.dsc + "</span></span></button>").join("");
}
function buildFilters() {
  const inView = rows();
  const global = State.view === "segment";
  $("#filterBar").innerHTML =
    '<div class="fgrp"><span class="flab">Year</span><select id="fYear">' +
      '<option value="ALL"' + (State.year === "ALL" ? " selected" : "") + ">All years</option>" +
      YEARS.map(y => '<option value="' + y + '"' + (State.year === y ? " selected" : "") + ">" +
        esc(YLAB[y] || y) + "</option>").join("") + "</select></div>" +
    '<div class="fgrp"><span class="flab">Sector</span><select id="fSector">' +
      '<option value="ALL"' + (State.sector === "ALL" ? " selected" : "") + ">All sectors</option>" +
      SECTORS.map(s => '<option value="' + esc(s) + '"' + (State.sector === s ? " selected" : "") + ">" +
        esc(s) + " (" + SECTOR_N[s] + ")</option>").join("") + "</select></div>" +
    '<div class="fgrp"><span class="flab">Signal</span>' +
      '<button class="chip s-all" data-sig="ALL" aria-pressed="' + (State.signal === "ALL") + '">All</button>' +
      SIGNALS.map(s => '<button class="chip ' + s.cls + '" data-sig="' + s.k + '" aria-pressed="' +
        (State.signal === s.k) + '">' + s.lab + "</button>").join("") + "</div>" +
    '<div class="fgrp"><span class="flab">Search</span>' +
      '<input class="searchbox" id="fQ" type="search" placeholder="Company or sector…" value="' +
      esc(State.q) + '" autocomplete="off"></div>' +
    '<button class="chip" id="fReset">Reset</button>' +
    '<div class="fspacer"></div>' +
    '<div class="fcount">In view <b>' + new Set(inView.map(r => r.c)).size + "</b> firms · <b>" +
      inView.length + "</b> firm-years of " + META.n_firmyears +
      (global ? ' <span style="color:var(--amber)">· theme table is full-sample</span>' : "") + "</div>";
}
function render() {
  buildNav(); buildFilters();
  const el = $("#page");
  el.innerHTML = (V[State.view] || V.overview)();
  if (State.view === "whatif") renderWhatIf();
  /* count-up on any KPI that asked for it */
  $$("[data-cu]").forEach(n => countUp(n, Number(n.dataset.cu), Number(n.dataset.dp), n.dataset.sign === "1"));
  wireDynamic();
}
function wireDynamic() {
  /* universe nodes */
  $$(".node").forEach(n => {
    n.addEventListener("mouseenter", e => {
      const c = n.dataset.c, y = n.dataset.y;
      const r = ROWS.find(x => x.c === c && x.y === y);
      if (!r) return;
      tipShow(e, "<b>" + esc(r.c) + "</b><br>" + esc(r.s) + " · " + esc(YLAB[r.y] || r.y) +
        '<br><span class="mono">z(LPS) ' + sgn(r.zL, 2) + " · z(OPS) " + sgn(r.zO, 2) + "</span>" +
        '<br><span class="mono" style="color:' + sigCol(r.sig) + '">GDS ' + sgn(r.G, 2) +
        " · peer-adj " + sgn(r.Gadj, 2) + "</span><br>" + (SIGMAP[r.sig] || {}).lab);
    });
    n.addEventListener("mousemove", e => tipShow(e, TIP.innerHTML));
    n.addEventListener("mouseleave", tipHide);
    n.addEventListener("click", () => { tipHide(); openCompany(n.dataset.c, n.dataset.y); });
  });
  /* rows */
  $$("[data-firm]").forEach(n => n.addEventListener("click", () =>
    openCompany(n.dataset.firm, n.dataset.year)));
  $$("[data-sector]").forEach(n => n.addEventListener("click", () => {
    State.sector = n.dataset.sector; render();
  }));
  $$("[data-goto]").forEach(n => n.addEventListener("click", () => {
    State.view = n.dataset.goto; render(); scrollTo({ top: 0, behavior: "smooth" });
  }));
  /* sortable headers */
  $$("th[data-sort]").forEach(th => {
    const go = () => {
      const k = th.dataset.sort;
      if (State.sortKey === k) State.sortDir *= -1;
      else { State.sortKey = k; State.sortDir = (k === "c" || k === "s" || k === "y") ? 1 : -1; }
      render();
    };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  /* filters */
  const fy = $("#fYear"), fs = $("#fSector"), fq = $("#fQ"), fr = $("#fReset");
  if (fy) fy.addEventListener("change", () => { State.year = fy.value; render(); });
  if (fs) fs.addEventListener("change", () => { State.sector = fs.value; render(); });
  if (fq) {
    let t;
    fq.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const pos = fq.selectionStart; State.q = fq.value; render();
        const nq = $("#fQ"); if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (e) {} }
      }, 180);
    });
  }
  if (fr) fr.addEventListener("click", () => {
    State.year = "ALL"; State.sector = "ALL"; State.signal = "ALL"; State.q = ""; render();
  });
  $$("[data-sig]").forEach(b => b.addEventListener("click", () => {
    State.signal = b.dataset.sig; render();
  }));
  $$(".navi").forEach(b => b.addEventListener("click", () => {
    State.view = b.dataset.view; render(); scrollTo({ top: 0, behavior: "smooth" });
  }));
}

/* ---------------- boot ---------------- */
$("#stampDate").textContent = META.data_extracted + " · compiled " + META.compiled + " · v" + META.version;
$("#scrim").addEventListener("click", closeCompany);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeCompany();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
    const q = $("#fQ"); if (q) { e.preventDefault(); q.focus(); q.select(); }
  }
});
$("#wiBtn").addEventListener("click", function () {
  State.view = "whatif"; render(); scrollTo({ top: 0, behavior: "smooth" });
});
$("#bellBtn").addEventListener("click", e => {
  tipShow(e, "<b>Data notices</b><br>Static snapshot, no live feed.<br>" +
    META.n_firmyears + " firm-years · " + META.n_firms + " firms · " + META.n_cars + " market observations." +
    "<br>9 firm-years carry incomplete extracted text (disclosed on Data Quality).");
  setTimeout(tipHide, 4200);
});
$("#printBtn").addEventListener("click", () => print());
$("#themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  r.dataset.contrast = r.dataset.contrast === "hi" ? "" : "hi";
  document.body.style.setProperty("--tx-3", r.dataset.contrast === "hi" ? "#B8CCD8" : "#9AAEB9");
  document.body.style.setProperty("--tx-4", r.dataset.contrast === "hi" ? "#8CA3B1" : "#506A78");
});
render();

</script>
</body>
</html>
